services:
  collector:
    build:
      context: ..
    restart: unless-stopped
    environment:
      AUTO_REFRESH: "1"
      REFRESH_MS: "${REFRESH_MS:-60000}"
      REFRESH_TIMEOUT_MS: "240000"
      MANUAL_REFRESH_COOLDOWN_MS: "${MANUAL_REFRESH_COOLDOWN_MS:-15000}"
      DATA_DIR: "/app/runtime/data"
      CAPTURE_DIR: "/app/runtime/captures"
      BROWSER_STATE_DIR: "/app/secrets/browser-state"
      SESSION_BROWSER_CDP_URL: "http://session-browser:9223"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      EBAY_CLIENT_ID: "${EBAY_CLIENT_ID:-}"
      EBAY_CLIENT_SECRET: "${EBAY_CLIENT_SECRET:-}"
      SNKRDUNK_FEED_URL: "${SNKRDUNK_FEED_URL:-}"
      SNKRDUNK_FEED_TOKEN: "${SNKRDUNK_FEED_TOKEN:-}"
    volumes:
      - collector_runtime:/app/runtime
      - ../secrets/browser-state:/app/secrets/browser-state:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - collector
    environment:
      API_DOMAIN: "${API_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  session-browser:
    image: lscr.io/linuxserver/chromium:latest
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    environment:
      PUID: "${SESSION_BROWSER_PUID:-1000}"
      PGID: "${SESSION_BROWSER_PGID:-1000}"
      TZ: "Asia/Shanghai"
      CHROME_CLI: "--no-first-run --disable-dev-shm-usage --user-data-dir=/config/.config/chromium --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222"
    expose:
      - "9222"
      - "9223"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - ../secrets/session-browser:/config
    shm_size: "1gb"

  session-browser-cdp:
    image: python:3.12-alpine
    restart: unless-stopped
    depends_on:
      - session-browser
    network_mode: "service:session-browser"
    volumes:
      - ../scripts/tcp_proxy.py:/tcp_proxy.py:ro
    command:
      - python
      - /tcp_proxy.py
      - 0.0.0.0
      - "9223"
      - 127.0.0.1
      - "9222"

volumes:
  collector_runtime:
  caddy_data:
  caddy_config:
